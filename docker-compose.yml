# Docker Compose for Veritas Development and Production
version: '3.8'

services:
  # Main Veritas Application
  veritas:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: veritas-app
    ports:
      - "3000:3000"
      - "5173:5173"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - STARKNET_NETWORK=testnet
      - STARKNET_RPC_URL=https://starknet-testnet.public.blastapi.io
      - DATABASE_URL=postgresql://veritas:password@postgres:5432/veritas
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - veritas-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: veritas-postgres
    environment:
      - POSTGRES_DB=veritas
      - POSTGRES_USER=veritas
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - veritas-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: veritas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - veritas-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: veritas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - veritas
    restart: unless-stopped
    networks:
      - veritas-network

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: veritas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - veritas-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: veritas-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - veritas-network

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: veritas-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - veritas-network

# Volumes
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

# Networks
networks:
  veritas-network:
    driver: bridge
