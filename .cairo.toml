# Veritas Enterprise Configuration
# Cairo Linting and Formatting Configuration

[tool.fmt]
sort-module-level-items = true
line-width = 100
tab-size = 4
indent-style = "space"

[tool.snforge]
exit_first = true
# Enable all tests by default
test_filter = "*"

# Cairo compiler configuration
[package]
name = "veritas"
version = "0.4.0"
edition = "2024_07"

cairo-version = "2.8.0"

[dependencies]
starknet = ">=2.8.0"
alexandria_math = { git = "https://github.com/keep-starknet-strange/alexandria.git" }
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts.git" }

# Development dependencies
[dev-dependencies]
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry.git", tag = "v0.27.0" }

# Build configuration
[[target.starknet-contract]]
allowed-libfuncs-list-name = "experimental"
sierra = true
casm = true

# Testing configuration
[tool.snforge.fork]
url = "https://starknet-sepolia.public.blastapi.io/rpc/v0_7"
block_number = "latest"

# Security configuration
[tool.security]
enable-auditor = true
security-level = "enterprise"
check-vulnerabilities = true
gas-optimization = true

# Documentation configuration
[tool.docs]
generate-docs = true
output-dir = "docs/generated"
include-private = false
format = "html"
